name: Keep personal edition offline
on:
  push:
    branches: [main]
    paths: [.github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  paused-page:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Replace published game with a paused notice
        run: |
          mkdir _site
          touch _site/.nojekyll
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta name="robots" content="noindex,nofollow">
          <title>个人版已暂停</title>
          <style>html{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a1430;color:#eef3ff;font:18px/1.7 system-ui,sans-serif}main{padding:32px;text-align:center}h1{font-size:28px}p{color:#b9cbf0}</style>
          <main><h1>个人版已暂停</h1><p>此个人游玩版本已停止公开提供游戏。</p></main>
          </html>
          HTML
          cp _site/index.html _site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
