name: Verify Chinese edition
on:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node tools/build-local.js
      - run: node tools/localization/verify-zh.cjs
      - run: node --test tools/tests/*.test.cjs
